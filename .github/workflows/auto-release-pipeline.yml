name: Auto Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write
  packages: write

# 串行发布。两个相近的 push 会各自基于同一 tag/VERSION 算出【同一个版本号】，
# 先完成者拿到它，后完成者在推 tag 时失败 —— 而那时 push_tag 不算 success、清理步骤不触发，
# 那次提交就静默地没发版，要人工重跑。串行执行让后一个跑在前一个之后，
# 重新读到已更新的 VERSION、算出正确的下一个号。
#
# cancel-in-progress 必须为 false：发布中途被取消会留下推了一半的 tag/Release/镜像，
# 而取消不触发 failure()、清理步骤不会执行。宁可排队等待。
#
# group 是固定字符串、不含 ${{ github.ref }}：本工作流只发布 main，所有运行都在争同一份
# tag/VERSION/latest，必须全局串行。按 ref 分组会让手动触发的其它分支自成一组、与 main 并行跑。
#
# queue: max 不可省。默认是 queue: single —— 组内只允许一个 pending，新来的 run 会
# 【取消并替换】那个 pending（cancel-in-progress: false 只保护正在跑的，管不到 pending）。
# 后果：A 在发布、含代码的 B 在排队、只改文档的 C 到来 → C 顶掉 B → C 判定无实质改动而跳过
# → B 的代码进了 main 却永远不会发版。queue: max 允许最多 100 个 pending 按顺序处理。
# 该选项只能与 cancel-in-progress: false/未设置 同用（与 true 组合会校验失败）。
concurrency:
  group: auto-release-main
  cancel-in-progress: false
  queue: max

jobs:
  release-pipeline:
    runs-on: ubuntu-latest
    # 两道门：
    # 1) 只在 main 上运行。本工作流会 `git push origin HEAD:main` —— 手动触发（workflow_dispatch）
    #    可以选任意分支，若不限制，在功能分支点 Run workflow 就会把未合并代码连同版本提交
    #    推进 main 并发布镜像。push 触发已由 on.push.branches 限定，这里管住 workflow_dispatch。
    # 2) 跳过 GitHub Actions 自己产生的提交，避免死循环。
    if: |
      github.ref == 'refs/heads/main' &&
      github.event.pusher.name != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    # 运行时断言，防御 job 级 if 被改动或写错。
    # workflow_dispatch 的分支选择器无法在 workflow 文件里限制（GitHub UI 总是允许选任意分支），
    # 而本工作流会 `git push origin HEAD:main`，在功能分支跑就等于把未合并代码发布出去。
    # 这一步在任何写操作之前失败，代价只是一次白跑。
    - name: Assert running on main
      env:
        REF: ${{ github.ref }}
      run: |
        if [ "${REF}" != "refs/heads/main" ]; then
          echo "::error::本工作流只能在 main 上运行（当前 ${REF}）。它会把 HEAD 推送到 main，在其它分支运行会发布未合并的代码。"
          exit 1
        fi
        echo "分支检查通过：${REF}"

    - name: Check if version bump is needed
      id: check
      run: |
        # 检查提交消息是否包含强制发布标记（[force release]）
        COMMIT_MSG=$(git log -1 --pretty=%B | tr -d '\r')
        echo "Latest commit message:"
        echo "$COMMIT_MSG"

        FORCE_RELEASE=false
        if echo "$COMMIT_MSG" | grep -qi "\[force release\]"; then
          echo "Detected [force release] marker, forcing version bump"
          FORCE_RELEASE=true
        fi

        # 【变更基线取"上一次成功发布的 tag"，不是"上一个提交"】
        #
        # 用 HEAD~1 作基线会漏发版：提交 A（含代码）的运行因 main 前进而作废后，
        # 紧随的提交 B（仅文档）的运行只看 B 相对 A 的差异 → 判定无实质改动 → 跳过，
        # 于是 A 的代码进了 main 却永远没有 tag/Release/镜像。
        #
        # 以最后一个发布 tag 为基线，"自上次发布以来是否有实质改动"才是这个判断真正要问的问题：
        # 上一次作废的内容会被下一次运行自然纳入，不会漏。
        git fetch origin --tags --force
        # `|| true` 不可省：仓库还没有任何 tag 时 grep 无匹配返回 1，
        # 而 GitHub 给 run 块默认加了 `-e`（shell: bash -e {0}），会让脚本在此直接退出。
        # "无 tag" 是合法状态（首次发布），必须让它落到下面的 else 分支
        LAST_RELEASE_TAG=$(git ls-remote --tags origin \
          | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
          | sed 's|refs/tags/||' | sort -V | tail -n1 || true)

        if [ -n "$LAST_RELEASE_TAG" ] && git rev-parse -q --verify "refs/tags/${LAST_RELEASE_TAG}" >/dev/null; then
          echo "变更基线：上次发布 ${LAST_RELEASE_TAG}"
          CHANGED_FILES=$(git diff --name-only "refs/tags/${LAST_RELEASE_TAG}..HEAD")
        else
          # 尚无任何发布 tag（首次发布），或本地取不到该 tag 对象：退回全量
          echo "变更基线：无发布 tag，视为首次发布（全量）"
          CHANGED_FILES=$(git ls-files)
        fi
        
        echo "Changed files:"
        echo "$CHANGED_FILES"
        
        # 检查是否只有无关文件（.md, docs/, .github/等）
        SIGNIFICANT_CHANGES=false
        while IFS= read -r file; do
          # 跳过空行
          [ -z "$file" ] && continue
          
          # 检查是否是需要忽略的文件
          if [[ ! "$file" =~ \.(md|txt)$ ]] && 
             [[ ! "$file" =~ ^docs/ ]] && 
             [[ ! "$file" =~ ^\.github/ ]] &&
             [[ "$file" != "VERSION" ]] &&
             [[ "$file" != ".gitignore" ]] &&
             [[ "$file" != "LICENSE" ]]; then
            echo "Found significant change in: $file"
            SIGNIFICANT_CHANGES=true
            break
          fi
        done <<< "$CHANGED_FILES"

        # 检查是否是手动触发
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "Manual workflow trigger detected, forcing version bump"
          echo "needs_bump=true" >> $GITHUB_OUTPUT
        elif [ "$FORCE_RELEASE" = true ]; then
          echo "Force release marker detected, forcing version bump"
          echo "needs_bump=true" >> $GITHUB_OUTPUT
        elif [ "$SIGNIFICANT_CHANGES" = true ]; then
          echo "Significant changes detected, version bump needed"
          echo "needs_bump=true" >> $GITHUB_OUTPUT
        else
          echo "No significant changes, skipping version bump"
          echo "needs_bump=false" >> $GITHUB_OUTPUT
        fi

    # 版本基线一律取【远端当前状态】，不用 checkout 时的本地快照。
    # 原因：concurrency 串行会让本 run 排队，期间前一个 run 已经推了新 tag 和新 VERSION；
    # 本地的 git describe / cat VERSION 仍是排队前的旧值，据此计算会撞上已发布的号。
    - name: Get current version
      if: steps.check.outputs.needs_bump == 'true'
      id: get_version
      run: |
        # 远端最新版本 tag（排序取最大，不用 git describe —— 它只看当前提交的祖先）
        git fetch origin --tags --force
        # `|| true`：无 tag 时 grep 返回 1，会被 run 块默认的 `-e` 当成致命错误
        LATEST_TAG=$(git ls-remote --tags origin \
          | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
          | sed 's|refs/tags/||' | sort -V | tail -n1 || true)
        LATEST_TAG=${LATEST_TAG:-v0.0.0}
        echo "Latest remote tag: $LATEST_TAG"
        TAG_VERSION=${LATEST_TAG#v}

        # 远端 main 上的 VERSION（不是工作区里那份）
        git fetch origin main
        FILE_VERSION=$(git show origin/main:VERSION 2>/dev/null | tr -d '[:space:]')
        FILE_VERSION=${FILE_VERSION:-0.0.0}
        echo "VERSION on origin/main: $FILE_VERSION"

        # 比较tag版本和文件版本，取较大值
        function version_gt() { test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"; }

        if version_gt "$FILE_VERSION" "$TAG_VERSION"; then
          VERSION="$FILE_VERSION"
          echo "Using VERSION file: $VERSION (newer than tag)"
        else
          VERSION="$TAG_VERSION"
          echo "Using tag version: $VERSION (newer or equal to file)"
        fi

        echo "Current version: $VERSION"
        echo "current_version=$VERSION" >> $GITHUB_OUTPUT

    - name: Calculate next version
      if: steps.check.outputs.needs_bump == 'true'
      id: next_version
      run: |
        VERSION="${{ steps.get_version.outputs.current_version }}"
        
        # 分割版本号
        IFS='.' read -r -a version_parts <<< "$VERSION"
        MAJOR="${version_parts[0]:-0}"
        MINOR="${version_parts[1]:-0}"
        PATCH="${version_parts[2]:-0}"
        
        # 默认递增patch版本
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
        
        echo "New version: $NEW_VERSION"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "new_tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Update VERSION file
      if: steps.check.outputs.needs_bump == 'true'
      run: |
        echo "${{ steps.next_version.outputs.new_version }}" > VERSION
        
        # 配置git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # 提交VERSION文件 - 添加 [skip ci] 以避免再次触发
        git add VERSION
        git commit -m "chore: sync VERSION file with release ${{ steps.next_version.outputs.new_tag }} [skip ci]"

    # 构建前端并推送到 web-dist 分支
    - name: Setup Node.js
      if: steps.check.outputs.needs_bump == 'true'
      uses: actions/setup-node@v7
      with:
        # 仅前端构建；运行时镜像见 Dockerfile 的 node:24-alpine
        # 2026-08 官方 Active LTS = 24（Krypton）；勿写 lts/*，避免无声跳大版本
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/admin-spa/package-lock.json

    - name: Build Frontend
      if: steps.check.outputs.needs_bump == 'true'
      run: |
        echo "Building frontend for version ${{ steps.next_version.outputs.new_version }}..."
        cd web/admin-spa
        npm ci
        npm run build
        echo "Frontend build completed"

    # 前端产物先暂存到工作区外，【不推送】。
    # 推送 web-dist 挪到发布成功之后（见 Push Frontend Build to web-dist Branch）：
    # 本次发布可能因 main 前进而作废，若此处已推 web-dist，就会出现
    # "源码部署拿到了新前端、镜像部署还是旧版本" 的不一致。
    - name: Stash frontend build
      if: steps.check.outputs.needs_bump == 'true'
      run: |
        set -euo pipefail
        DIST_STASH="${RUNNER_TEMP}/web-dist-stash"
        rm -rf "$DIST_STASH"
        mkdir -p "$DIST_STASH"
        cp -r web/admin-spa/dist/* "$DIST_STASH/"
        echo "前端产物已暂存到 $DIST_STASH"

    # 必须解到 RUNNER_TEMP：曾解压在仓库根目录，只 mv 二进制、残留 git-cliff-*/
    # 被后续 git add --all 误提交进 web-dist；之后再 checkout web-dist 就会
    # "untracked working tree files would be overwritten" 直接 abort。
    - name: Install git-cliff
      if: steps.check.outputs.needs_bump == 'true'
      run: |
        set -euo pipefail
        CLIFF_VER=2.13.1
        CLIFF_DIR="${RUNNER_TEMP}/git-cliff"
        rm -rf "$CLIFF_DIR"
        mkdir -p "$CLIFF_DIR"
        cd "$CLIFF_DIR"
        wget -q "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VER}/git-cliff-${CLIFF_VER}-x86_64-unknown-linux-gnu.tar.gz"
        tar -xzf "git-cliff-${CLIFF_VER}-x86_64-unknown-linux-gnu.tar.gz"
        sudo mv "git-cliff-${CLIFF_VER}/git-cliff" /usr/local/bin/
        rm -rf "$CLIFF_DIR"

    # changelog 必须有长度上限。曾经在这里翻过车：
    # `git describe --tags` 只看当前提交的祖先且只查本地 tag —— fork 不继承上游 tag，
    # 于是判定"无 tag"走全量分支，把上游几年的提交history 全生成出来（实测 213KB），
    # 传给 action-gh-release 时撑爆 execve 参数上限，报 "Argument list too long"、发布失败。
    - name: Generate changelog
      if: steps.check.outputs.needs_bump == 'true'
      id: changelog
      env:
        # Release 正文上限 125000 字符（GitHub API 的硬限制），
        # 这里取更保守的值：留足空间给正文里的固定段落（docker pull 指令、标题等）
        MAX_CHANGELOG_BYTES: 20000
      run: |
        # 注意 GitHub 给 run 块默认加了 -e（shell: bash -e {0}）。
        # 本步骤里"命令返回非 0"多数是正常分支（grep 无匹配 = 仓库还没有 tag），
        # 不是错误，所以显式关掉 -e，由各处自己判断结果。
        set +e
        set -uo pipefail

        # 基线取【远端最大版本 tag】，与 Get current version 同口径。
        # 不用 git describe：它只看当前提交的祖先，且 fork 上没有上游 tag
        git fetch origin --tags --force
        LAST_TAG=$(git ls-remote --tags origin \
          | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
          | sed 's|refs/tags/||' | sort -V | tail -n1 || true)

        if [ -n "$LAST_TAG" ] && git rev-parse -q --verify "refs/tags/${LAST_TAG}" >/dev/null; then
          echo "changelog 范围：${LAST_TAG}..HEAD"
          RANGE="refs/tags/${LAST_TAG}..HEAD"
        else
          # 无发布 tag（首次发布）：只取最近 30 个提交，不生成全量历史。
          # 全量在 fork 上等于把上游历史全抄一遍，既无意义又会超长
          echo "changelog 范围：无发布 tag，取最近 30 个提交"
          BASE_SHA=$(git rev-list --max-count=31 HEAD | tail -n1)
          RANGE="${BASE_SHA}..HEAD"
        fi

        CHANGELOG=$(git-cliff --config .github/cliff.toml "$RANGE" --strip header 2>/dev/null \
          | grep -v "bump version" | sed '/^$/d') || CHANGELOG=""
        [ -n "$CHANGELOG" ] || CHANGELOG="- 代码优化和改进"

        # 兜底截断：即使范围正确，积累很多提交的一次发布也可能超长
        BYTES=$(printf '%s' "$CHANGELOG" | wc -c)
        if [ "$BYTES" -gt "$MAX_CHANGELOG_BYTES" ]; then
          echo "::warning::changelog ${BYTES} 字节超过上限 ${MAX_CHANGELOG_BYTES}，已截断（完整历史见提交记录）"
          CHANGELOG=$(printf '%s' "$CHANGELOG" | head -c "$MAX_CHANGELOG_BYTES")
          CHANGELOG=$(printf '%s\n\n%s' "$CHANGELOG" '_（更新日志过长已截断，完整内容见提交记录）_')
        fi
        echo "changelog 长度：$(printf '%s' "$CHANGELOG" | wc -c) 字节"

        # 随机分隔符：changelog 内容里若出现 'EOF' 单独一行会提前结束 heredoc、污染后续输出
        DELIM="CHANGELOG_$(openssl rand -hex 8)"
        {
          echo "content<<${DELIM}"
          printf '%s\n' "$CHANGELOG"
          echo "${DELIM}"
        } >> "$GITHUB_OUTPUT" || {
          # 上面关了 -e，这里必须自己检查：写不进 output 后续步骤会拿到空 changelog
          echo "::error::写入 GITHUB_OUTPUT 失败"
          exit 1
        }

    - name: Prepare image names
      id: image_names
      if: steps.check.outputs.needs_bump == 'true'
      run: |
        # 仅发布到 GHCR：用内置 GITHUB_TOKEN 推送，无需额外 secrets
        GHCR_IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/claude-relay-service" | tr '[:upper:]' '[:lower:]')

        echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"

    # Docker构建步骤
    - name: Set up QEMU
      if: steps.check.outputs.needs_bump == 'true'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: steps.check.outputs.needs_bump == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      if: steps.check.outputs.needs_bump == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 发布顺序的关键约束：VERSION 提交与 tag 一起推，这是本次运行第一次写 origin。
    # 排在镜像构建之前是有意的：Git 侧可撤回（删 tag/Release），GHCR 的 latest 不可撤回，
    # 所以先做可撤回的、最后做不可撤回的（见 Point latest 与 Clean up 两步的注释）。
    #
    # 【禁止 rebase 到 origin/main】。曾经为了解决"非快进被拒"在这里 rebase，那是错的：
    # 前端产物(web-dist)、changelog、镜像 label 里的 image.revision 全部基于触发时的 HEAD 生成，
    # 而 rebase 会把 VERSION 提交重放到期间新进 main 的代码之上 —— tag 和镜像内容变成新代码，
    # 产物与元数据却还是旧快照，一个发布版本对不上自己的构建产物。
    #
    # 正确做法：这次发布只发布触发时的那个提交。若期间 main 前进了，推送会因非快进失败，
    # 本次发布作废（清理步骤撤掉 tag/Release），由那个新提交自己的 run 去发布它自己的内容。
    # concurrency 串行已让这种情况变少；真发生时"作废重来"比"发布拼接内容"正确。
    - name: Create and push tag
      id: push_tag
      if: steps.check.outputs.needs_bump == 'true'
      env:
        NEW_TAG: ${{ steps.next_version.outputs.new_tag }}
        TRIGGER_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # 确认 main 仍停在触发本次运行的提交上。前进了就说明这次发布的产物已经过时。
        git fetch origin main
        REMOTE_SHA=$(git rev-parse origin/main)
        if [ "${REMOTE_SHA}" != "${TRIGGER_SHA}" ]; then
          echo "::error::main 已从 ${TRIGGER_SHA} 前进到 ${REMOTE_SHA}，本次发布的前端产物与 changelog 已过时。"
          echo "::error::本次发布作废；新提交会由它自己的运行发布。"
          exit 1
        fi

        git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
        # --atomic：main 与 tag 同事务全成或全败，避免 main 被拒但 tag 已写入。
        # 非快进不重试、不 rebase：失败即作废（理由见上方注释）。
        #
        # 仅 --atomic 不够：远端可能已原子写入，客户端却因断线收到失败。
        # 若随后一次 git fetch 也因网络挂掉且被 set -e 直接打死，push_tag.outcome=failure，
        # cleanup 旧条件 (outcome==success) 会跳过 → 远端留下「有 tag/VERSION、无完整发布」。
        # 因此：① 客户端失败后带退避重试核对远端；② cleanup 在 push_tag 非 skipped 时也跑，
        # 且 cleanup 必须核对 tag 解引用提交 == 本次 release_sha，禁止只按名字删（防误删外部同名发布）。
        LOCAL_HEAD=$(git rev-parse HEAD)
        # 供 cleanup 校验「这个 tag 是不是本 run 的」；VERSION 提交 SHA，不是 github.sha
        echo "release_sha=${LOCAL_HEAD}" >> "$GITHUB_OUTPUT"
        # push_uncertain=true：客户端失败且远端持续不可达，可能已原子写入；cleanup 必须真删掉或 fail
        echo "push_uncertain=false" >> "$GITHUB_OUTPUT"
        if ! git push --atomic origin HEAD:main "${NEW_TAG}"; then
          echo "::warning::git push 客户端返回失败，带退避核对远端是否已原子写入..."
          VERIFIED=0
          REACHABLE=0
          for attempt in 1 2 3 4 5; do
            if git fetch origin main --tags --force 2>/dev/null; then
              REACHABLE=1
              REMOTE_MAIN=$(git rev-parse origin/main 2>/dev/null || true)
              if [ "${REMOTE_MAIN}" != "${LOCAL_HEAD}" ]; then
                echo "::error::推送失败：远端 main=${REMOTE_MAIN:-无} 不是本提交 ${LOCAL_HEAD}"
                git tag -d "${NEW_TAG}" 2>/dev/null || true
                exit 1
              fi
              if [ -z "$(git ls-remote --tags origin "refs/tags/${NEW_TAG}" 2>/dev/null || true)" ]; then
                echo "::error::推送失败：远端 main 已更新但 tag ${NEW_TAG} 不存在"
                git tag -d "${NEW_TAG}" 2>/dev/null || true
                exit 1
              fi
              if git fetch origin "refs/tags/${NEW_TAG}:refs/tags/${NEW_TAG}" --force 2>/dev/null; then
                TAG_COMMIT=$(git rev-parse "${NEW_TAG}^{}" 2>/dev/null || true)
                if [ "${TAG_COMMIT}" = "${LOCAL_HEAD}" ]; then
                  VERIFIED=1
                  break
                fi
                echo "::error::推送失败：远端 tag ${NEW_TAG} 指向 ${TAG_COMMIT:-无}，不是本提交 ${LOCAL_HEAD}"
                git tag -d "${NEW_TAG}" 2>/dev/null || true
                exit 1
              fi
            fi
            echo "::warning::第 ${attempt}/5 次核对远端未完成，$((attempt * 3))s 后重试..."
            sleep $((attempt * 3))
          done
          if [ "${VERIFIED}" -eq 1 ]; then
            echo "::warning::远端 main 与 tag 已指向 ${LOCAL_HEAD}，视为推送成功（客户端结果丢失）"
          else
            if [ "${REACHABLE}" -eq 0 ]; then
              # 远端可能已写入：标 uncertain，cleanup 在仍不可达时必须 fail（禁止当「无 tag」静默成功）
              echo "push_uncertain=true" >> "$GITHUB_OUTPUT"
              echo "::error::推送结果不确定：客户端失败且多次无法 fetch 远端。cleanup 须清掉可能的孤儿 tag，清不掉则 fail。"
            else
              echo "::error::推送失败：能连上远端但无法确认 tag ${NEW_TAG} 指向本提交"
            fi
            git tag -d "${NEW_TAG}" 2>/dev/null || true
            exit 1
          fi
        fi

    # 正文写文件再用 body_path 传，不用 body: | 内联。
    # 内联会把整段正文当作进程参数传给 action，超过 execve 上限就 "Argument list too long"
    # （曾因此发布失败）。走文件则与长度无关，只受 GitHub API 自身的 125000 字符限制约束。
    - name: Compose release notes
      if: steps.check.outputs.needs_bump == 'true'
      env:
        IMAGE: ${{ steps.image_names.outputs.ghcr_image }}
        NEW_TAG: ${{ steps.next_version.outputs.new_tag }}
        CHANGELOG: ${{ steps.changelog.outputs.content }}
        REPO: ${{ github.repository }}
        # 正文归属标记：cleanup 只删 body 含本 run_id 的 Release，不靠 create_release.outcome
        # （outcome=failure 既可能未落库，也可能服务端已建；外部补救不会带此标记）
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
        {
          # 隐藏 HTML 注释，generate_release_notes 追加内容时通常保留 body 前缀
          echo "<!-- crs-release-run:${RUN_ID} -->"
          echo '## 🐳 Docker 镜像'
          echo
          echo '```bash'
          echo '# 固定版本'
          echo "docker pull ${IMAGE}:${NEW_TAG}"
          echo '# 跟随最新（发布流程全部成功后才指向本版本）'
          echo "docker pull ${IMAGE}:latest"
          echo '```'
          echo
          echo '## 📦 主要更新'
          echo
          printf '%s\n' "${CHANGELOG}"
          echo
          echo '## 📋 完整更新日志'
          echo
          echo "查看 [所有版本](https://github.com/${REPO}/releases)"
        } > "$NOTES_FILE"
        echo "正文长度：$(wc -c < "$NOTES_FILE") 字节"

    - name: Create GitHub Release
      id: create_release
      if: steps.check.outputs.needs_bump == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.next_version.outputs.new_tag }}
        name: Release ${{ steps.next_version.outputs.new_version }}
        body_path: ${{ runner.temp }}/release-notes.md
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Build and push Docker image
      if: steps.check.outputs.needs_bump == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ steps.image_names.outputs.ghcr_image }}:${{ steps.next_version.outputs.new_tag }}
          ${{ steps.image_names.outputs.ghcr_image }}:${{ steps.next_version.outputs.new_version }}
        labels: |
          org.opencontainers.image.version=${{ steps.next_version.outputs.new_version }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 【不能 continue-on-error】。web-dist 不是次要路径：scripts/manage.sh 的安装、更新、
    # 切分支三条流程都从这个分支取预构建前端（见 manage.sh 中 --branch web-dist 的 clone）。
    # 推送失败却把发布标记为成功，会让源码部署的用户一直停在上一版前端，
    # 而流水线显示绿色、没人知道要补，直到下一次真正发版才会被动修复。
    #
    # 所以失败必须让 workflow 红掉。带重试（网络抖动是最常见的失败原因），
    # 重试仍失败就 exit 1 —— 此时 tag/Release/镜像已成功，清理步骤会撤掉它们，
    # 整个版本作废重来，而不是留下一个"镜像新、源码部署旧"的半成品发布。
    - name: Push Frontend Build to web-dist Branch
      if: steps.check.outputs.needs_bump == 'true'
      env:
        NEW_VERSION: ${{ steps.next_version.outputs.new_version }}
      run: |
        set -euo pipefail
        DIST_STASH="${RUNNER_TEMP}/web-dist-stash"

        if git ls-remote --heads origin web-dist | grep -q web-dist; then
          echo "Checking out existing web-dist branch"
          git fetch origin web-dist:web-dist
          git checkout web-dist
        else
          echo "Creating new web-dist branch"
          git checkout --orphan web-dist
        fi

        # 清空当前目录（保留 .git）
        git rm -rf . 2>/dev/null || true

        cp -r "$DIST_STASH"/* .

        cat > README.md << EOF
        # Claude Relay Service - Web Frontend Build

        This branch contains the pre-built frontend assets for Claude Relay Service.

        **DO NOT EDIT FILES IN THIS BRANCH DIRECTLY**

        These files are automatically generated by the CI/CD pipeline.

        Version: ${NEW_VERSION}
        Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        EOF

        cat > .gitignore << EOF
        node_modules/
        *.log
        .DS_Store
        .env
        EOF

        git add --all -- ':!node_modules'
        git commit -m "chore: update frontend build for v${NEW_VERSION} [skip ci]"

        # 重试三次：--force 推送是幂等的（每次都把分支指向同一个本地提交），重试无副作用
        PUSHED=0
        for attempt in 1 2 3; do
          if git push origin web-dist --force; then
            PUSHED=1
            break
          fi
          echo "::warning::web-dist 推送失败（第 ${attempt} 次），5 秒后重试"
          sleep 5
        done

        if [ "$PUSHED" -ne 1 ]; then
          echo "::error::web-dist 推送三次均失败。源码部署（scripts/manage.sh）依赖该分支取前端，"
          echo "::error::留着会让源码部署用户停在旧前端且无人知晓，故本次发布整体作废（清理步骤会撤掉 tag/Release）。"
          exit 1
        fi

        # 切回 main，后续步骤（清理旧版本等）在 main 上操作
        git checkout main
        rm -rf "$DIST_STASH"

    # latest 是【整条流水线最后一个写操作】，也是唯一不可撤回的那个
    # （GHCR 不保留 latest 的历史指向，一旦覆盖就还原不了）。
    # 所以它必须等 Git tag、VERSION、Release、版本镜像、web-dist 全部落地之后才移动：
    # 前面任何一步失败，latest 仍指向上一个完整发布的版本，用户拉不到半成品。
    # 新增发布动作时一律排在本步之前，不要排在后面。
    #
    # 用 buildx imagetools create 从已推送的版本 tag 复制 manifest，不重新构建：
    # 既省一次多架构构建，也保证 latest 与版本 tag 指向完全相同的镜像。
    - name: Point latest at the new release
      if: steps.check.outputs.needs_bump == 'true'
      env:
        IMAGE: ${{ steps.image_names.outputs.ghcr_image }}
        NEW_TAG: ${{ steps.next_version.outputs.new_tag }}
      run: |
        docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${NEW_TAG}"
        echo "latest -> ${NEW_TAG}"

    # web-dist 推送放在发布链路全部成功之后：它服务的是"源码部署"路径
    # （scripts/manage.sh 从这个分支取预构建前端），必须与已发布的镜像版本对应。
    # 放在前面的话，发布中途失败会留下一个没有对应镜像版本的前端产物。
    # 失败清理。必须放在【所有被监控步骤之后】——failure() 判的是"到本步为止已发生失败",
    # 放在被监控步骤之前它永远是 false、永远跳过（本文件曾犯过这个错）。
    #
    # 【版本号只进不退】这是本步骤最重要的设计决定,不要改成"把 VERSION 退回旧值":
    # 版本镜像在本步之前已推到 GHCR,而 GHCR 不允许删除 tag 内的 manifest。若把版本号退回,
    # 下次发布会算出同一个号,但此时 main 可能已有新提交 —— 于是【同一个版本 tag 被换成不同内容】,
    # 已经 pin 住该 tag 的用户会在无感知的情况下拿到不同镜像。固定版本必须不可变,
    # 所以宁可跳一个号(纯粹是数字上的浪费),也不能让 v2.0.7 今天和明天指向不同东西。
    #
    # 因此本步只做两件事:删掉这个不完整发布的 Release 与 Git tag,让该版本号成为"作废号"。
    # main 上递增后的 VERSION 保留 —— 下次发布从它继续 +1,拿到一个全新的、没被占用过的号。
    #
    # web-dist 分支不回滚:它总是被 --force 覆盖成"最后一次成功构建的前端",
    # 没有版本语义、也不影响镜像部署。若它推成功而后续失败,下次发布会再覆盖一次。
    #
    # 删除失败一律 fail,不吞错(曾用 `|| echo` 吞掉,会在权限/保护规则/网络问题时
    # 谎报"已回滚",而残留 tag 会让下次版本计算取到它、造成真正的跳号与状态不一致)。
    # push_tag 成功后后续失败 → 必清；push_tag 客户端失败但远端可能已写入本 run 的 tag → 也要跑。
    # tag：只删「解引用提交 == release_sha」的，禁止只按名字删（防误删外部同名发布）。
    # tag 状态必须落到三选一：ABSENT / OWNED / EXTERNAL。ls-remote 见 tag 但 peel 失败
    # 不算 EXTERNAL——否则 push 已成功、cleanup fetch 抖一下就会静默留下本 run 孤儿 tag。
    # Release：不靠 create_release.outcome。只删 body 含 <!-- crs-release-run:${run_id} --> 的。
    # gh release view 失败 ≠ Release 不存在：API/网络错误时禁止删 tag，否则会留下无 tag 的孤儿 Release。
    # 网络：ls-remote/fetch 失败 ≠ tag 不存在；全不可达必须 fail。
    # outcome==skipped 才是 needs_bump=false。
    - name: Clean up incomplete release
      if: failure() && steps.check.outputs.needs_bump == 'true' && steps.push_tag.outcome != 'skipped'
      env:
        NEW_TAG: ${{ steps.next_version.outputs.new_tag }}
        NEW_VERSION: ${{ steps.next_version.outputs.new_version }}
        IMAGE: ${{ steps.image_names.outputs.ghcr_image }}
        RELEASE_SHA: ${{ steps.push_tag.outputs.release_sha }}
        PUSH_UNCERTAIN: ${{ steps.push_tag.outputs.push_uncertain }}
        RUN_ID: ${{ github.run_id }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        echo "::warning::发布未完成，尝试清理本 run 的 ${NEW_TAG}（VERSION 保留在 ${NEW_VERSION}，该号作废不再复用）"

        if [ -z "${RELEASE_SHA}" ]; then
          echo "::warning::无 release_sha（push_tag 可能在写出 SHA 前就失败），跳过清理以免误删外部同名 tag"
          exit 0
        fi

        FAILED=0
        OWNED=0
        EXTERNAL=0
        REACHABLE=0
        TAG_ABSENT=0
        RUN_MARKER="<!-- crs-release-run:${RUN_ID} -->"

        # 带退避探测远端：区分「不存在 / 本 run / 外部 / 见得到但 peel 不了」
        for attempt in 1 2 3 4 5; do
          LS_ERR=0
          LS_OUT=$(git ls-remote --tags origin "refs/tags/${NEW_TAG}" 2>/dev/null) || LS_ERR=$?
          if [ "${LS_ERR}" -ne 0 ]; then
            echo "::warning::第 ${attempt}/5 次 ls-remote 失败（网络？），$((attempt * 3))s 后重试..."
            sleep $((attempt * 3))
            continue
          fi
          REACHABLE=1
          if [ -z "${LS_OUT}" ]; then
            TAG_ABSENT=1
            echo "tag ${NEW_TAG} 不存在，无需删 tag"
            break
          fi
          # ls-remote 已见 tag：必须 peel 出提交才能判 OWNED/EXTERNAL，不能 break 成 OWNED=0
          if git fetch origin "refs/tags/${NEW_TAG}:refs/tags/${NEW_TAG}" --force 2>/dev/null; then
            TAG_COMMIT=$(git rev-parse "${NEW_TAG}^{}" 2>/dev/null || true)
            if [ -n "${TAG_COMMIT}" ] && [ "${TAG_COMMIT}" = "${RELEASE_SHA}" ]; then
              OWNED=1
              echo "远端 tag ${NEW_TAG} 指向本 run 提交 ${RELEASE_SHA}，将清理"
              break
            fi
            if [ -n "${TAG_COMMIT}" ]; then
              EXTERNAL=1
              echo "::warning::远端 tag ${NEW_TAG} 指向 ${TAG_COMMIT}，不是本 run 的 ${RELEASE_SHA}，视为外部发布，不删除"
              break
            fi
            echo "::warning::第 ${attempt}/5 次 peel tag 无提交对象，$((attempt * 3))s 后重试..."
          else
            echo "::warning::第 ${attempt}/5 次 fetch tag 失败，$((attempt * 3))s 后重试..."
          fi
          sleep $((attempt * 3))
        done

        if [ "${REACHABLE}" -eq 0 ]; then
          echo "::error::无法联系远端确认 tag ${NEW_TAG} 状态（ls-remote 均失败）。"
          echo "::error::若 push 实际已写入，远端可能残留无 Release/镜像/web-dist 的孤儿 tag，请人工检查并删除。"
          exit 1
        fi

        # ls-remote 见 tag 但始终未能 OWNED/EXTERNAL/ABSENT → 不能当「不属于我」静默成功
        # （push 已 success、后续镜像失败、cleanup fetch 抖动 就会留下本 run 孤儿 tag）
        if [ "${TAG_ABSENT}" -ne 1 ] && [ "${OWNED}" -ne 1 ] && [ "${EXTERNAL}" -ne 1 ]; then
          echo "::error::远端存在 tag ${NEW_TAG}（ls-remote 非空），但多次无法 fetch/peel 校验归属。"
          echo "::error::禁止当作外部 tag 跳过：请人工确认并删除本 run 可能留下的孤儿 tag。"
          exit 1
        fi

        if [ "${OWNED}" -eq 1 ]; then
          # Release 归属只看 body 是否含本 run 标记。
          # gh release view 失败 ≠ 不存在：API/网络错误时禁止删 tag，否则留下无 tag 的孤儿 Release。
          # 外部/补救 Release（body 无 marker）同样禁止删同名 tag，否则会把它变成无 tag 孤儿。
          CAN_DELETE_TAG=1
          VIEW_ERR_FILE=$(mktemp)
          VIEW_BODY_FILE=$(mktemp)
          if gh release view "${NEW_TAG}" --json body -q .body >"${VIEW_BODY_FILE}" 2>"${VIEW_ERR_FILE}"; then
            RELEASE_BODY=$(cat "${VIEW_BODY_FILE}")
            if printf '%s' "${RELEASE_BODY}" | grep -Fq "${RUN_MARKER}"; then
              if gh release delete "${NEW_TAG}" --yes; then
                echo "已删除本 run 的 Release ${NEW_TAG}（body 含 ${RUN_MARKER}）"
              else
                echo "::error::删除 Release ${NEW_TAG} 失败，请手动删除"
                FAILED=1
                CAN_DELETE_TAG=0
              fi
            else
              echo "::warning::Release ${NEW_TAG} 存在但 body 无本 run 标记，视为外部/补救发布；不删 Release，也不删同名 tag"
              CAN_DELETE_TAG=0
            fi
          else
            if grep -qiE 'not found|HTTP 404|Could not find|no release found|Not Found' "${VIEW_ERR_FILE}"; then
              echo "Release ${NEW_TAG} 不存在，跳过"
            else
              echo "::error::查询 Release ${NEW_TAG} 失败（非 not-found），不删 tag 以免留下孤儿 Release："
              cat "${VIEW_ERR_FILE}" || true
              FAILED=1
              CAN_DELETE_TAG=0
            fi
          fi
          rm -f "${VIEW_ERR_FILE}" "${VIEW_BODY_FILE}"

          if [ "${CAN_DELETE_TAG}" -eq 1 ]; then
            if git push origin ":refs/tags/${NEW_TAG}"; then
              echo "已删除 tag ${NEW_TAG}"
            else
              echo "::error::删除 tag ${NEW_TAG} 失败（可能有 tag 保护规则），请手动删除"
              FAILED=1
            fi
          else
            echo "::warning::跳过删 tag ${NEW_TAG}（外部/补救 Release、查询失败或删 Release 失败）"
          fi
        fi

        if [ "$FAILED" -ne 0 ]; then
          echo "::error::清理未完全成功，需人工介入：确认 ${NEW_TAG} 的 tag/Release 状态"
          exit 1
        fi

        # push 结果不确定时，必须确认本 run 的 tag 已不在或可判定为外部
        if [ "${PUSH_UNCERTAIN}" = "true" ] && [ "${OWNED}" -eq 0 ] && [ "${TAG_ABSENT}" -ne 1 ] && [ "${EXTERNAL}" -ne 1 ]; then
          echo "::error::push 结果曾不确定，且未能确认 tag ${NEW_TAG} 已清除或归属外部，请人工检查远端"
          exit 1
        fi

        if [ "${OWNED}" -eq 1 ]; then
          echo "::notice::清理完成。GHCR 上的 ${IMAGE}:${NEW_TAG} 无法删除但已作废（latest 未移动，不影响用户）；下次发布将使用新版本号。"
        else
          echo "::notice::未清理任何远端对象（无本 run 归属的 tag，或 tag 本就不存在/属外部）。"
        fi

    # 自动清理旧的tags和releases（保持最近50个）
    - name: Cleanup old tags and releases
      if: steps.check.outputs.needs_bump == 'true'
      continue-on-error: true
      env:
        TAGS_TO_KEEP: 50
        # gh release delete/view 需要 token,缺失会静默失败(被 continue-on-error 吞掉)
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🧹 自动清理旧版本，保持最近 $TAGS_TO_KEEP 个tag..."
        
        # 获取所有版本tag并按版本号排序（从旧到新）
        echo "正在获取所有tags..."
        ALL_TAGS=$(git ls-remote --tags origin | grep -E 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | awk '{print $2}' | sed 's|refs/tags/||' | sort -V)
        
        # 检查是否获取到tags
        if [ -z "$ALL_TAGS" ]; then
          echo "⚠️ 未找到任何版本tag"
          exit 0
        fi
        
        TOTAL_COUNT=$(echo "$ALL_TAGS" | wc -l)
        
        echo "📊 当前tag统计："
        echo "- 总数: $TOTAL_COUNT"
        echo "- 配置保留: $TAGS_TO_KEEP"
        
        if [ "$TOTAL_COUNT" -gt "$TAGS_TO_KEEP" ]; then
          DELETE_COUNT=$((TOTAL_COUNT - TAGS_TO_KEEP))
          echo "- 将要删除: $DELETE_COUNT 个最旧的tag"
          
          # 获取要删除的tags（最老的）
          TAGS_TO_DELETE=$(echo "$ALL_TAGS" | head -n "$DELETE_COUNT")
          
          # 显示将要删除的版本范围
          OLDEST_TO_DELETE=$(echo "$TAGS_TO_DELETE" | head -1)
          NEWEST_TO_DELETE=$(echo "$TAGS_TO_DELETE" | tail -1)
          echo ""
          echo "🗑️ 将要删除的版本范围："
          echo "- 从: $OLDEST_TO_DELETE"
          echo "- 到: $NEWEST_TO_DELETE"
          
          echo ""
          echo "开始执行删除..."
          SUCCESS_COUNT=0
          FAIL_COUNT=0
          
          for tag in $TAGS_TO_DELETE; do
            echo -n "  删除 $tag ... "
            
            # 先检查release是否存在
            if gh release view "$tag" >/dev/null 2>&1; then
              # Release存在，删除release会同时删除tag
              if gh release delete "$tag" --yes --cleanup-tag 2>/dev/null; then
                echo "✅ (release+tag)"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                echo "❌ (release删除失败)"
                FAIL_COUNT=$((FAIL_COUNT + 1))
              fi
            else
              # Release不存在，只删除tag
              if git push origin --delete "$tag" 2>/dev/null; then
                echo "✅ (仅tag)"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                echo "⏭️ (已不存在)"
                FAIL_COUNT=$((FAIL_COUNT + 1))
              fi
            fi
          done
          
          echo ""
          echo "📊 清理结果："
          echo "- 成功删除: $SUCCESS_COUNT"
          echo "- 失败/跳过: $FAIL_COUNT"
          
          # 重新获取并显示保留的版本范围
          echo ""
          echo "正在验证清理结果..."
          REMAINING_TAGS=$(git ls-remote --tags origin | grep -E 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | awk '{print $2}' | sed 's|refs/tags/||' | sort -V)
          REMAINING_COUNT=$(echo "$REMAINING_TAGS" | wc -l)
          OLDEST=$(echo "$REMAINING_TAGS" | head -1)
          NEWEST=$(echo "$REMAINING_TAGS" | tail -1)
          
          echo "✅ 清理完成！"
          echo ""
          echo "📌 当前保留的版本："
          echo "- 最旧版本: $OLDEST"
          echo "- 最新版本: $NEWEST"
          echo "- 版本总数: $REMAINING_COUNT"
          
          # 验证是否达到预期
          if [ "$REMAINING_COUNT" -le "$TAGS_TO_KEEP" ]; then
            echo "- 状态: ✅ 符合预期（≤$TAGS_TO_KEEP）"
          else
            echo "- 状态: ⚠️ 超出预期（某些tag可能删除失败）"
          fi
        else
          echo "✅ 当前tag数量（$TOTAL_COUNT）未超过限制（$TAGS_TO_KEEP），无需清理"
        fi

    # success() 不可省：默认条件只排除"前序失败"，而 Cleanup 带 continue-on-error，
    # 它吞掉的失败会让本步以为一切正常。加 success() 才保证回滚发生时不发"发布成功"通知。
    - name: Send Telegram Notification
      if: success() && steps.check.outputs.needs_bump == 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GHCR_IMAGE: ${{ steps.image_names.outputs.ghcr_image }}
      continue-on-error: true
      run: |
        VERSION="${{ steps.next_version.outputs.new_version }}"
        TAG="${{ steps.next_version.outputs.new_tag }}"
        REPO="${{ github.repository }}"
        
        # 获取更新内容并限制长度
        CHANGELOG="${{ steps.changelog.outputs.content }}"
        CHANGELOG_TRUNCATED=$(echo "$CHANGELOG" | head -c 1000)
        if [ ${#CHANGELOG} -gt 1000 ]; then
          CHANGELOG_TRUNCATED="${CHANGELOG_TRUNCATED}..."
        fi
        
        # 构建消息内容
        MESSAGE="🚀 *Claude Relay Service 新版本发布！*"$'\n'$'\n'
        MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'
        MESSAGE+="📝 *更新内容:*"$'\n'
        MESSAGE+="${CHANGELOG_TRUNCATED}"$'\n'$'\n'
        MESSAGE+="🐳 *Docker 部署:*"$'\n'
        MESSAGE+="\`\`\`bash"$'\n'
        MESSAGE+="docker pull ${GHCR_IMAGE}:${TAG}"$'\n'
        MESSAGE+="docker pull ${GHCR_IMAGE}:latest"$'\n'
        MESSAGE+="\`\`\`"$'\n'$'\n'
        MESSAGE+="🔗 *相关链接:*"$'\n'
        MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG})"$'\n'
        MESSAGE+="• [完整更新日志](https://github.com/${REPO}/releases)"$'\n'
        MESSAGE+="• [GHCR](https://ghcr.io/${GHCR_IMAGE#ghcr.io/})"$'\n'$'\n'
        MESSAGE+="#ClaudeRelay #Update #v${VERSION//./_}"
        
        # 使用 jq 构建 JSON 并发送
        jq -n \
          --arg chat_id "${TELEGRAM_CHAT_ID}" \
          --arg text "${MESSAGE}" \
          '{
            chat_id: $chat_id,
            text: $text,
            parse_mode: "Markdown",
            disable_web_page_preview: false
          }' | \
        curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -H "Content-Type: application/json" \
          -d @-
